name: sr_studies
description: SR STUDIES - Education App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1

  # YouTube videos - play inside the app
  youtube_player_flutter: ^9.1.3

  # Open Instagram / Telegram / other external links
  url_launcher: ^6.3.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Custom App Launcher Icon
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png

# ============================================================
# APP ICON
# ============================================================

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
