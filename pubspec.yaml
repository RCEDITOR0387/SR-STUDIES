name: sr_studies
description: SR STUDIES - Education App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ----------------------------------------------------------
  # FIREBASE
  # ----------------------------------------------------------
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1

  # ----------------------------------------------------------
  # YOUTUBE VIDEO PLAYER
  # Recorded + Live + Speed + Fullscreen
  # ----------------------------------------------------------
  youtube_player_flutter: ^9.1.3

  # ----------------------------------------------------------
  # ANDROID V1 EMBEDDING FIX
  # youtube_player_flutter uses this WebView package
  # ----------------------------------------------------------
  flutter_inappwebview: ^6.1.5

  # ----------------------------------------------------------
  # OPEN YOUTUBE / INSTAGRAM / TELEGRAM LINKS
  # ----------------------------------------------------------
  url_launcher: ^6.3.2

  # ----------------------------------------------------------
  # ICONS
  # ----------------------------------------------------------
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Flutter lint rules
  flutter_lints: ^6.0.0

  # App launcher icon
  flutter_launcher_icons: ^0.14.4

# ============================================================
# FLUTTER
# ============================================================

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png

# ============================================================
# APP LAUNCHER ICON
# ============================================================

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
