name: Build SR STUDIES APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      # 3. Check Firebase Configuration
      - name: Check Firebase Configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: google-services.json not found!"
            exit 1
          fi

          echo "Firebase configuration found."

      # 4. Read Firebase Package Name
      - name: Read Firebase Package Name
        run: |
          PACKAGE_NAME=$(python3 -c "import json; print(json.load(open('android/app/google-services.json'))['client'][0]['client_info']['android_client_info']['package_name'])")

          if [ -z "$PACKAGE_NAME" ]; then
            echo "ERROR: Firebase package name is empty!"
            exit 1
          fi

          echo "Firebase package name: $PACKAGE_NAME"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

      # 5. Backup Firebase Configuration
      - name: Backup Firebase Configuration
        run: |
          cp android/app/google-services.json /tmp/google-services.json
          echo "Firebase configuration backed up."

      # 6. Remove Old Android Project
      - name: Remove Old Android Project
        run: |
          rm -rf android
          echo "Old Android project removed."

      # 7. Create Modern Android Project
      - name: Create Modern Android Project
        run: |
          python3 - <<'PY'
          import os

          package = os.environ["PACKAGE_NAME"]

          parts = package.split(".")

          if len(parts) < 2:
              raise SystemExit(
                  "ERROR: Invalid Android package name: " + package
              )

          project_name = parts[-1]
          organization = ".".join(parts[:-1])

          # Flutter project names must be valid Dart package names.
          project_name = project_name.replace("-", "_")

          print("Firebase package :", package)
          print("Flutter org      :", organization)
          print("Project name     :", project_name)

          with open("/tmp/flutter_create_args", "w") as f:
              f.write(organization + "\n")
              f.write(project_name + "\n")
          PY

          ORG=$(sed -n '1p' /tmp/flutter_create_args)
          PROJECT=$(sed -n '2p' /tmp/flutter_create_args)

          flutter create \
            --platforms=android \
            --project-name="$PROJECT" \
            --org="$ORG" \
            .

          echo "Modern Android project created."

      # 8. Remove Default Flutter Test
      - name: Remove Default Flutter Test
        run: |
          rm -f test/widget_test.dart
          echo "Default widget test removed."

      # 9. Restore Firebase Configuration
      - name: Restore Firebase Configuration
        run: |
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json
          echo "Firebase configuration restored."

      # 10. Configure Android Package
      - name: Configure Android Package
        run: |
          echo "Firebase package: $PACKAGE_NAME"

          python3 - <<'PY'
          import os
          import re

          package = os.environ["PACKAGE_NAME"]

          files = [
              "android/app/build.gradle.kts",
              "android/app/src/main/AndroidManifest.xml"
          ]

          for filename in files:
              if not os.path.exists(filename):
                  print("File not found, skipping:", filename)
                  continue

              with open(filename, "r", encoding="utf-8") as f:
                  text = f.read()

              # Replace common/example package references.
              text = text.replace(
                  "com.example.sr_studies",
                  package
              )

              text = text.replace(
                  "com.example.srStudies",
                  package
              )

              with open(filename, "w", encoding="utf-8") as f:
                  f.write(text)

              print("Configured:", filename)
          PY

          echo "Android package configuration completed."

      # 11. Configure Google Services Plugin
      - name: Configure Google Services Plugin
        run: |
          if ! grep -q 'com.google.gms.google-services' android/settings.gradle.kts; then
            sed -i '/plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' \
              android/settings.gradle.kts
          fi

          if ! grep -q 'id("com.google.gms.google-services")' android/app/build.gradle.kts; then
            sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' \
              android/app/build.gradle.kts
          fi

          echo "Google Services configured."

      # 12. Get Flutter Dependencies
      - name: Get Dependencies
        run: |
          flutter pub get

      # 13. Check Custom App Icon
      - name: Check Custom App Icon
        run: |
          if [ ! -f assets/icon/app_icon.png ]; then
            echo "ERROR: assets/icon/app_icon.png not found!"
            exit 1
          fi

          echo "Custom app icon found."

      # 14. Generate Android App Icons
      - name: Generate Android App Icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

          ICON="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          echo "Preparing SR STUDIES custom icon..."

          # Create temporary clean icon.
          # This prevents malformed PNG metadata, unusual color modes,
          # alpha problems, or multi-frame PNG issues from breaking
          # icon generation.

          convert "$ICON" \
            -auto-orient \
            -background white \
            -alpha remove \
            -alpha off \
            -resize 1024x1024 \
            -gravity center \
            -extent 1024x1024 \
            -strip \
            PNG24:/tmp/sr_studies_icon.png

          echo "Checking normalized icon..."

          identify /tmp/sr_studies_icon.png

          # Make Android mipmap folders.
          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          echo "Generating MDPI icon..."
          convert /tmp/sr_studies_icon.png \
            -resize 48x48 \
            -strip \
            PNG32:"$RES/mipmap-mdpi/ic_launcher.png"

          echo "Generating HDPI icon..."
          convert /tmp/sr_studies_icon.png \
            -resize 72x72 \
            -strip \
            PNG32:"$RES/mipmap-hdpi/ic_launcher.png"

          echo "Generating XHDPI icon..."
          convert /tmp/sr_studies_icon.png \
            -resize 96x96 \
            -strip \
            PNG32:"$RES/mipmap-xhdpi/ic_launcher.png"

          echo "Generating XXHDPI icon..."
          convert /tmp/sr_studies_icon.png \
            -resize 144x144 \
            -strip \
            PNG32:"$RES/mipmap-xxhdpi/ic_launcher.png"

          echo "Generating XXXHDPI icon..."
          convert /tmp/sr_studies_icon.png \
            -resize 192x192 \
            -strip \
            PNG32:"$RES/mipmap-xxxhdpi/ic_launcher.png"

          echo "All Android launcher icons generated."

      # 15. Configure Android Launcher Icon
      - name: Configure Launcher Icon
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found!"
            exit 1
          fi

          # Make sure Android uses our generated icon.
          if grep -q 'android:icon=' "$MANIFEST"; then
            sed -i 's#android:icon="[^"]*"#android:icon="@mipmap/ic_launcher"#' "$MANIFEST"
          else
            sed -i 's#<application#<application android:icon="@mipmap/ic_launcher"#' "$MANIFEST"
          fi

          echo "Launcher icon configured."

          echo "Current application icon setting:"
          grep -n 'android:icon' "$MANIFEST" || true

      # 16. Analyze Flutter Code
      - name: Analyze Flutter Code
        run: |
          flutter analyze

      # 17. Build Release APK
      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      # 18. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-STUDIES-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
