name: Build SR STUDIES APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true


      # ============================================================
      # 3. CHECK FIREBASE CONFIGURATION
      # ============================================================

      - name: Check Firebase Configuration
        shell: bash
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: android/app/google-services.json not found!"
            exit 1
          fi

          echo "Firebase configuration found."


      # ============================================================
      # 4. READ FIREBASE PACKAGE NAME
      # ============================================================

      - name: Read Firebase Package Name
        shell: bash
        run: |
          PACKAGE_NAME=$(python3 - <<'PY'
          import json

          with open("android/app/google-services.json", "r") as f:
              data = json.load(f)

          print(
              data["client"][0]["client_info"]
              ["android_client_info"]["package_name"]
          )
          PY
          )

          if [ -z "$PACKAGE_NAME" ]; then
            echo "ERROR: Firebase package name is empty!"
            exit 1
          fi

          echo "Firebase package: $PACKAGE_NAME"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"


      # ============================================================
      # 5. BACKUP FIREBASE
      # ============================================================

      - name: Backup Firebase Configuration
        shell: bash
        run: |
          mkdir -p /tmp/sr_firebase

          cp android/app/google-services.json \
            /tmp/sr_firebase/google-services.json

          echo "Firebase configuration backed up."


      # ============================================================
      # 6. REMOVE OLD ANDROID PROJECT
      # ============================================================

      - name: Remove Old Android Project
        shell: bash
        run: |
          rm -rf android

          echo "Old Android project removed."


      # ============================================================
      # 7. CALCULATE PACKAGE
      # ============================================================

      - name: Calculate Flutter Package Parts
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re

          package = os.environ["PACKAGE_NAME"]
          parts = package.split(".")

          if len(parts) < 2:
              raise SystemExit(
                  "Invalid Android package name: " + package
              )

          project_name = parts[-1]
          organization = ".".join(parts[:-1])

          project_name = re.sub(
              r"[^a-zA-Z0-9_]",
              "_",
              project_name
          )

          if not project_name[0].isalpha():
              project_name = "sr_" + project_name

          with open("/tmp/sr_org", "w") as f:
              f.write(organization)

          with open("/tmp/sr_project", "w") as f:
              f.write(project_name)

          print("Organization:", organization)
          print("Project:", project_name)
          PY


      # ============================================================
      # 8. CREATE FRESH MODERN ANDROID PROJECT
      # ============================================================

      - name: Create Modern Android Project
        shell: bash
        run: |
          ORG=$(cat /tmp/sr_org)
          PROJECT=$(cat /tmp/sr_project)

          flutter create \
            --platforms=android \
            --org="$ORG" \
            --project-name="$PROJECT" \
            .

          echo "Fresh modern Android project created."


      # ============================================================
      # 9. REMOVE DEFAULT TEST
      # ============================================================

      - name: Remove Default Flutter Test
        shell: bash
        run: |
          rm -f test/widget_test.dart

          echo "Default test removed."


      # ============================================================
      # 10. RESTORE FIREBASE
      # ============================================================

      - name: Restore Firebase Configuration
        shell: bash
        run: |
          mkdir -p android/app

          cp /tmp/sr_firebase/google-services.json \
            android/app/google-services.json

          echo "Firebase configuration restored."


      # ============================================================
      # 11. CONFIGURE GOOGLE SERVICES
      # ============================================================

      - name: Configure Google Services
        shell: bash
        run: |
          SETTINGS="android/settings.gradle.kts"
          APP_GRADLE="android/app/build.gradle.kts"

          echo "Configuring Google Services..."

          if ! grep -q 'com.google.gms.google-services' "$SETTINGS"; then
            sed -i \
              '/plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' \
              "$SETTINGS"
          fi

          if ! grep -q 'id("com.google.gms.google-services")' "$APP_GRADLE"; then
            sed -i \
              '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' \
              "$APP_GRADLE"
          fi

          echo "Google Services configured."


      # ============================================================
      # 12. CONFIGURE APP NAME
      # ============================================================

      - name: Configure SR STUDIES App Name
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          import re

          path = "android/app/src/main/AndroidManifest.xml"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if 'android:label=' in text:
              text = re.sub(
                  r'android:label="[^"]*"',
                  'android:label="SR STUDIES"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  '<application',
                  '<application android:label="SR STUDIES"',
                  1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("App name configured: SR STUDIES")
          PY


      # ============================================================
      # 13. CHECK MODERN ANDROID EMBEDDING
      # ============================================================

      - name: Verify Modern Android Embedding
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found!"
            exit 1
          fi

          if grep -R \
            -E "io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|io\.flutter\.app\.FlutterFragmentActivity" \
            android 2>/dev/null; then

            echo "ERROR: Old Flutter Android V1 embedding detected!"
            exit 1
          fi

          echo "Modern Flutter Android embedding confirmed."


      # ============================================================
      # 14. CHECK APP ICON
      # ============================================================

      - name: Check Custom App Icon
        shell: bash
        run: |
          if [ ! -f "assets/icon/app_icon.png" ]; then
            echo "ERROR: assets/icon/app_icon.png not found!"
            echo "Please upload your app icon to:"
            echo "assets/icon/app_icon.png"
            exit 1
          fi

          echo "Custom app icon found."


      # ============================================================
      # 15. GET DEPENDENCIES
      # ============================================================

      - name: Get Dependencies
        shell: bash
        run: |
          flutter pub get


      # ============================================================
      # 16. GENERATE LAUNCHER ICON
      # NO IMAGEMAGICK
      # ============================================================

      - name: Generate App Launcher Icon
        shell: bash
        run: |
          dart run flutter_launcher_icons

          echo "SR STUDIES launcher icon generated."


      # ============================================================
      # 17. CHECK FLUTTER DEPENDENCIES
      # ============================================================

      - name: Check Flutter Dependencies
        shell: bash
        run: |
          flutter pub deps

          echo "Flutter dependencies checked."


      # ============================================================
      # 18. FINAL V1 EMBEDDING CHECK
      # ============================================================

      - name: Final Android V1 Check
        shell: bash
        run: |
          echo "Checking Android project for V1 embedding..."

          if grep -R \
            -E "io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|io\.flutter\.app\.FlutterFragmentActivity|flutterEmbedding.*value=\"1\"" \
            android 2>/dev/null; then

            echo "ERROR: Android V1 embedding found!"
            exit 1
          fi

          echo "No Android V1 embedding found."


      # ============================================================
      # 19. ANALYZE FLUTTER CODE
      # ============================================================

      - name: Analyze Code
        shell: bash
        run: |
          flutter analyze


      # ============================================================
      # 20. CLEAN BUILD
      # ============================================================

      - name: Clean Flutter Build
        shell: bash
        run: |
          flutter clean
          flutter pub get


      # ============================================================
      # 21. BUILD APK
      # ============================================================

      - name: Build APK
        shell: bash
        run: |
          flutter build apk --release


      # ============================================================
      # 22. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          echo "======================================"
          echo "SR STUDIES APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"


      # ============================================================
      # 23. UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-STUDIES-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
