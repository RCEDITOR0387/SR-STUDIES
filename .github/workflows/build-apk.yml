name: Build SR STUDIES APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      # 3. Check Firebase Configuration
      - name: Check Firebase Configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: android/app/google-services.json not found!"
            exit 1
          fi

          echo "Firebase configuration found."

      # 4. Read Firebase Package Name
      - name: Read Firebase Package Name
        run: |
          PACKAGE_NAME=$(python3 -c "import json; print(json.load(open('android/app/google-services.json'))['client'][0]['client_info']['android_client_info']['package_name'])")

          echo "Firebase package: $PACKAGE_NAME"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV

      # 5. Backup Firebase Configuration
      - name: Backup Firebase Configuration
        run: |
          mkdir -p /tmp/firebase
          cp android/app/google-services.json /tmp/firebase/google-services.json

          echo "Firebase configuration backed up."

      # 6. Remove Old Android Project
      - name: Remove Old Android Project
        run: |
          rm -rf android
          echo "Old Android project removed."

      # 7. Create Modern Android Project
      - name: Create Modern Android Project
        run: |
          flutter create \
            --platforms=android \
            --project-name=sr_studies \
            .

          echo "Modern Android project created."

      # 8. Remove Default Flutter Test
      - name: Remove Default Flutter Test
        run: |
          rm -f test/widget_test.dart
          echo "Default widget test removed."

      # 9. Restore Firebase Configuration
      - name: Restore Firebase Configuration
        run: |
          mkdir -p android/app

          cp /tmp/firebase/google-services.json \
             android/app/google-services.json

          echo "Firebase configuration restored."

      # 10. Configure Android Package
      - name: Configure Android Package
        run: |
          sed -i "s/com.example.sr_studies/$PACKAGE_NAME/g" \
            android/app/build.gradle.kts

          echo "Android package configured: $PACKAGE_NAME"

      # 11. Configure Google Services Plugin
      - name: Configure Google Services Plugin
        run: |
          if ! grep -q 'com.google.gms.google-services' android/settings.gradle.kts; then
            sed -i '/plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' \
              android/settings.gradle.kts
          fi

          if ! grep -q 'id("com.google.gms.google-services")' android/app/build.gradle.kts; then
            sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' \
              android/app/build.gradle.kts
          fi

          echo "Google Services plugin configured."

      # 12. Get Dependencies
      - name: Get Dependencies
        run: |
          flutter pub get

      # 13. Generate Custom App Icon
      - name: Generate Custom App Icon
        run: |
          dart run flutter_launcher_icons

          echo "Custom SR STUDIES app icon generated."

      # 14. Analyze Flutter Code
      - name: Analyze Code
        run: |
          flutter analyze

      # 15. Build Release APK
      - name: Build APK
        run: |
          flutter build apk --release

      # 16. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-STUDIES-APK
          path: build/app/outputs/flutter-apk/app-release.apk
