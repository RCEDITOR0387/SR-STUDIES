name: Build SR STUDIES APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      # 3. Check Firebase Configuration
      - name: Check Firebase Configuration
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: android/app/google-services.json not found!"
            exit 1
          fi

          echo "Firebase configuration found."

      # 4. Read Firebase Package Name
      - name: Read Firebase Package Name
        shell: bash
        run: |
          PACKAGE_NAME=$(python3 - <<'PY'
          import json

          with open("android/app/google-services.json", "r") as f:
              data = json.load(f)

          print(
              data["client"][0]["client_info"]
              ["android_client_info"]["package_name"]
          )
          PY
          )

          if [ -z "$PACKAGE_NAME" ]; then
            echo "ERROR: Firebase package name is empty!"
            exit 1
          fi

          echo "Firebase package: $PACKAGE_NAME"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

      # 5. Backup Firebase Configuration
      - name: Backup Firebase Configuration
        run: |
          mkdir -p /tmp/sr_firebase

          cp android/app/google-services.json \
             /tmp/sr_firebase/google-services.json

          echo "Firebase configuration backed up."

      # 6. Remove Old Android Project
      - name: Remove Old Android Project
        run: |
          rm -rf android

          echo "Old Android project removed."

      # 7. Calculate Flutter Package Parts
      - name: Calculate Flutter Package Parts
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re

          package = os.environ["PACKAGE_NAME"]
          parts = package.split(".")

          if len(parts) < 2:
              raise SystemExit(
                  "Invalid Android package name: " + package
              )

          project_name = parts[-1]
          organization = ".".join(parts[:-1])

          project_name = re.sub(
              r"[^a-zA-Z0-9_]",
              "_",
              project_name
          )

          if not project_name[0].isalpha():
              project_name = "sr_" + project_name

          with open("/tmp/sr_org", "w") as f:
              f.write(organization)

          with open("/tmp/sr_project", "w") as f:
              f.write(project_name)

          print("Organization:", organization)
          print("Project:", project_name)
          PY

      # 8. Create Modern Android Project
      - name: Create Modern Android Project
        run: |
          ORG=$(cat /tmp/sr_org)
          PROJECT=$(cat /tmp/sr_project)

          flutter create \
            --platforms=android \
            --org="$ORG" \
            --project-name="$PROJECT" \
            .

          echo "Modern Android project created."

      # 9. Remove Default Flutter Test
      - name: Remove Default Flutter Test
        run: |
          rm -f test/widget_test.dart

          echo "Default test removed."

      # 10. Restore Firebase Configuration
      - name: Restore Firebase Configuration
        run: |
          mkdir -p android/app

          cp /tmp/sr_firebase/google-services.json \
             android/app/google-services.json

          echo "Firebase configuration restored."

      # 11. Configure Android Application
      - name: Configure Android Application
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          import re

          path = "android/app/src/main/AndroidManifest.xml"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # -----------------------------------------
          # APP NAME
          # -----------------------------------------

          if 'android:label=' in text:
              text = re.sub(
                  r'android:label="[^"]*"',
                  'android:label="SR STUDIES"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  '<application',
                  '<application android:label="SR STUDIES"',
                  1
              )

          # -----------------------------------------
          # FLUTTER EMBEDDING V2
          # -----------------------------------------

          # Remove old V1 application reference if present.
          text = text.replace(
              'android:name="io.flutter.app.FlutterApplication"',
              'android:name="${applicationName}"'
          )

          # Add modern applicationName if missing.
          app_start = text.find("<application")
          app_end = text.find(">", app_start)

          if app_start != -1 and app_end != -1:
              application_tag = text[app_start:app_end]

              if "android:name=" not in application_tag:
                  text = text[:app_end] + \
                      ' android:name="${applicationName}"' + \
                      text[app_end:]

          # -----------------------------------------
          # LAUNCHER ICON
          # -----------------------------------------

          if 'android:icon=' in text:
              text = re.sub(
                  r'android:icon="[^"]*"',
                  'android:icon="@mipmap/ic_launcher"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  '<application',
                  '<application android:icon="@mipmap/ic_launcher"',
                  1
              )

          # -----------------------------------------
          # FORCE FLUTTER EMBEDDING V2
          # -----------------------------------------

          if "android:name=\"flutterEmbedding\"" in text:
              text = re.sub(
                  r'<meta-data\s+'
                  r'android:name="flutterEmbedding"\s+'
                  r'android:value="[^"]*"\s*/>',
                  '''<meta-data
                android:name="flutterEmbedding"
                android:value="2" />''',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  '</application>',
                  '''<meta-data
                android:name="flutterEmbedding"
                android:value="2" />
          </application>''',
                  1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("SR STUDIES Android configuration complete.")
          print("Flutter Android Embedding: V2")
          print("Launcher: @mipmap/ic_launcher")
          PY

      # 12. Verify Modern Android Embedding
      - name: Verify Modern Android Embedding
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found!"
            exit 1
          fi

          if grep -q "io.flutter.app.FlutterActivity" "$MANIFEST"; then
            echo "ERROR: Old FlutterActivity detected!"
            exit 1
          fi

          if grep -q "io.flutter.app.FlutterApplication" "$MANIFEST"; then
            echo "ERROR: Old FlutterApplication detected!"
            exit 1
          fi

          if grep -q 'android:name="flutterEmbedding"' "$MANIFEST" && \
             grep -q 'android:value="2"' "$MANIFEST"; then

            echo "Modern Flutter Android Embedding V2 confirmed."

          else
            echo "ERROR: Flutter Embedding V2 metadata missing!"
            cat "$MANIFEST"
            exit 1
          fi

      # 13. Configure Google Services
      - name: Configure Google Services
        shell: bash
        run: |
          if ! grep -q "com.google.gms.google-services" \
            android/settings.gradle.kts; then

            sed -i \
              '/plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' \
              android/settings.gradle.kts
          fi

          if ! grep -q 'id("com.google.gms.google-services")' \
            android/app/build.gradle.kts; then

            sed -i \
              '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' \
              android/app/build.gradle.kts
          fi

          echo "Google Services configured."

      # 14. Check Custom App Icon
      - name: Check Custom App Icon
        shell: bash
        run: |
          if [ ! -f "assets/icon/app_icon.png" ]; then
            echo "WARNING: assets/icon/app_icon.png not found."
            echo "A fallback icon will be generated."
          else
            echo "Custom icon file found."
          fi

      # 15. Install ImageMagick
      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

          echo "ImageMagick installed."

      # 16. Generate Safe Android Launcher Icons
      - name: Generate Safe Android Launcher Icons
        shell: bash
        run: |
          ICON="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          echo "Checking custom icon..."

          VALID_ICON="false"

          if [ -f "$ICON" ]; then
            if identify "$ICON" >/dev/null 2>&1; then
              VALID_ICON="true"
              echo "Valid custom PNG detected."
            else
              echo "WARNING: app_icon.png is invalid or unreadable."
            fi
          fi

          # -----------------------------------------
          # USE CUSTOM ICON IF VALID
          # -----------------------------------------

          if [ "$VALID_ICON" = "true" ]; then

            echo "Using custom SR STUDIES icon."

            convert "$ICON" \
              -auto-orient \
              -background white \
              -alpha remove \
              -alpha off \
              -resize 1024x1024 \
              -gravity center \
              -extent 1024x1024 \
              -strip \
              PNG24:/tmp/sr_studies_icon.png

          else

            echo "Creating safe SR STUDIES fallback icon."

            # This is ONLY a temporary build icon.
            # The original app_icon.png is NOT deleted.

            convert \
              -size 1024x1024 \
              xc:white \
              -gravity center \
              -fill black \
              -pointsize 110 \
              -annotate +0+0 "SR STUDIES" \
              PNG24:/tmp/sr_studies_icon.png

            echo "Fallback icon created."

          fi

          # -----------------------------------------
          # VERIFY GENERATED ICON
          # -----------------------------------------

          if ! identify /tmp/sr_studies_icon.png >/dev/null 2>&1; then
            echo "ERROR: Generated launcher icon is invalid!"
            exit 1
          fi

          identify /tmp/sr_studies_icon.png

          # -----------------------------------------
          # REMOVE ADAPTIVE ICON XML
          # -----------------------------------------

          rm -f \
            "$RES/mipmap-anydpi-v26/ic_launcher.xml" \
            "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" \
            2>/dev/null || true

          # -----------------------------------------
          # GENERATE ALL ANDROID SIZES
          # -----------------------------------------

          convert /tmp/sr_studies_icon.png \
            -resize 48x48 \
            PNG24:"$RES/mipmap-mdpi/ic_launcher.png"

          convert /tmp/sr_studies_icon.png \
            -resize 72x72 \
            PNG24:"$RES/mipmap-hdpi/ic_launcher.png"

          convert /tmp/sr_studies_icon.png \
            -resize 96x96 \
            PNG24:"$RES/mipmap-xhdpi/ic_launcher.png"

          convert /tmp/sr_studies_icon.png \
            -resize 144x144 \
            PNG24:"$RES/mipmap-xxhdpi/ic_launcher.png"

          convert /tmp/sr_studies_icon.png \
            -resize 192x192 \
            PNG24:"$RES/mipmap-xxxhdpi/ic_launcher.png"

          echo "======================================"
          echo "ANDROID LAUNCHER ICONS READY"
          echo "======================================"

      # 17. Get Flutter Dependencies
      - name: Get Dependencies
        run: |
          flutter pub get

      # 18. Final Android V1 Check
      - name: Final Android V1 Check
        shell: bash
        run: |
          echo "Checking for old Android V1 embedding..."

          if grep -R \
            -E "io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|flutterEmbedding.*value=\"1\"" \
            android 2>/dev/null; then

            echo "ERROR: Old Android V1 embedding found!"
            exit 1
          fi

          echo "No Android V1 embedding detected."

      # 19. Analyze Flutter Code
      - name: Analyze Code
        run: |
          flutter analyze

      # 20. Clean Flutter Build
      - name: Clean Flutter Build
        run: |
          flutter clean
          flutter pub get

      # 21. Build Release APK
      - name: Build APK
        run: |
          flutter build apk --release

      # 22. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          echo "======================================"
          echo "SR STUDIES APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      # 23. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-STUDIES-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
