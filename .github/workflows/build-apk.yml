name: Build SR STUDIES APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android Project
        run: flutter create --platforms=android --project-name=sr_studies .

      - name: Check Firebase Config
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: google-services.json not found!"
            exit 1
          fi
          echo "Firebase config found."

      - name: Read Firebase Package Name
        run: |
          PACKAGE_NAME=$(python3 -c "import json; print(json.load(open('android/app/google-services.json'))['client'][0]['client_info']['android_client_info']['package_name'])")
          echo "Firebase package: $PACKAGE_NAME"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV

      - name: Configure Android Package
        run: |
          sed -i "s/com.example.sr_studies/$PACKAGE_NAME/g" android/app/build.gradle.kts
          sed -i "s/com.example.sr_studies/$PACKAGE_NAME/g" android/app/src/main/AndroidManifest.xml 2>/dev/null || true

      - name: Configure Google Services Plugin
        run: |
          sed -i '/dev.flutter.flutter-plugin-loader/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts

          sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-STUDIES-APK
          path: build/app/outputs/flutter-apk/app-release.apk
